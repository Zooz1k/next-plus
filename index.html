<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Next Plus</title>
<style>
:root{--bg:#070a10;--card:#111722;--line:#263142;--text:#fff;--muted:#9da7b8;--brand:#20d6a3;--danger:#ff5f6d;--warn:#ffc857}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Tahoma,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:20;background:#0b0f17ee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 5%;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:25px;font-weight:800;color:var(--brand)}.container{width:92%;max-width:1100px;margin:25px auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:18px}
h1,h2,h3{margin-top:0}p{color:var(--muted);line-height:1.7}.hidden{display:none!important}
input,select,textarea{width:100%;background:#080c13;color:#fff;border:1px solid #303949;border-radius:11px;padding:13px;margin:6px 0}
textarea{min-height:100px;resize:vertical}.btn{border:0;border-radius:11px;padding:12px 16px;background:var(--brand);color:#06100c;font-weight:700;margin:4px}
.btn.secondary{background:#18202d;color:#fff;border:1px solid #303949}.btn.danger{background:#ff5f6d;color:#fff}.btn.warn{background:#ffc857;color:#111}
.actions{display:flex;flex-wrap:wrap;gap:6px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.service,.order,.user,.note{border:1px solid var(--line);border-radius:14px;padding:15px;background:#0d131d}.price,.balance{color:var(--brand);font-weight:800;font-size:22px}
.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#18202d;color:#dbe3ef;font-size:12px}.ok{color:var(--brand)}.err{color:var(--danger)}.muted{color:var(--muted)}
.nav{display:flex;gap:7px;overflow:auto;margin-bottom:18px}.nav button{white-space:nowrap}
.center{max-width:520px;margin:55px auto}.toprow{display:flex;justify-content:space-between;gap:10px;align-items:center}
.small{font-size:13px}.empty{text-align:center;padding:20px;color:var(--muted)}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}.modalbox{width:min(600px,100%);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
@media(max-width:600px){header{padding:13px 4%}.container{width:94%}.card{padding:16px}.toprow{align-items:flex-start}.actions .btn{flex:1}}
</style>
</head>
<body>
<header>
  <div class="logo">Next Plus</div>
  <div id="headerActions"></div>
</header>

<main class="container">
  <section id="authView" class="center">
    <div class="card">
      <h1 id="authTitle">تسجيل الدخول</h1>
      <p id="authSub">ادخل إلى حسابك في Next Plus</p>
      <div id="nameWrap" class="hidden"><input id="name" placeholder="الاسم"></div>
      <input id="email" type="email" placeholder="البريد الإلكتروني">
      <input id="password" type="password" placeholder="كلمة المرور">
      <button class="btn" id="authBtn">تسجيل الدخول</button>
      <button class="btn secondary" id="switchAuth">إنشاء حساب جديد</button>
      <div id="authMsg"></div>
    </div>
  </section>

  <section id="appView" class="hidden">
    <div class="nav">
      <button class="btn secondary" data-page="home">الرئيسية</button>
      <button class="btn secondary" data-page="services">الخدمات</button>
      <button class="btn secondary" data-page="orders">طلباتي</button>
      <button class="btn secondary" data-page="notifications">الإشعارات</button>
      <button class="btn secondary" data-page="account">حسابي</button>
      <button class="btn warn hidden" id="adminNav" data-page="admin">لوحة الأدمن</button>
    </div>

    <section id="homePage" class="page">
      <div class="card">
        <h1>أهلاً <span id="welcomeName"></span> 👋</h1>
        <p>اطلب خدمتك وتابع حالتها من مكان واحد.</p>
        <div>رصيدك الحالي</div>
        <div class="balance"><span id="balance">0</span> جنيه</div>
      </div>
      <div class="card"><h2>🔔 آخر الإشعارات</h2><div id="homeNotes"></div></div>
      <div class="card"><h2>🛍️ الخدمات</h2><div id="homeServices" class="grid"></div></div>
    </section>

    <section id="servicesPage" class="page hidden">
      <div class="card"><h2>الخدمات المتاحة</h2><div id="servicesList" class="grid"></div></div>
    </section>

    <section id="ordersPage" class="page hidden">
      <div class="card"><h2>طلباتي</h2><div id="ordersList"></div></div>
    </section>

    <section id="notificationsPage" class="page hidden">
      <div class="card"><h2>🔔 الإشعارات</h2><div id="notesList"></div></div>
    </section>

    <section id="accountPage" class="page hidden">
      <div class="card"><h2>حسابي</h2><p>الاسم: <b id="accountName"></b></p><p>البريد: <b id="accountEmail"></b></p><p>الرصيد: <b class="ok"><span id="accountBalance"></span> جنيه</b></p></div>
    </section>

    <section id="adminPage" class="page hidden">
      <div class="card">
        <h2>👑 لوحة التحكم</h2>
        <p>إدارة المستخدمين والخدمات والطلبات والإشعارات.</p>
        <div class="nav">
          <button class="btn" data-admin="users">المستخدمين</button>
          <button class="btn" data-admin="services">الخدمات</button>
          <button class="btn" data-admin="orders">الطلبات</button>
          <button class="btn" data-admin="notify">إشعار</button>
        </div>
      </div>
      <div id="adminContent"></div>
    </section>
  </section>
</main>

<div id="modal" class="modal hidden"><div class="modalbox"><div class="toprow"><h3 id="modalTitle"></h3><button class="btn secondary" onclick="closeModal()">إغلاق</button></div><div id="modalBody"></div></div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,addDoc,collection,getDocs,query,where,orderBy,limit,serverTimestamp,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyAxNbiOlJbslTTw9kAA-TPksib1TuwxL0",authDomain:"next-plus-ae61e.firebaseapp.com",projectId:"next-plus-ae61e",storageBucket:"next-plus-ae61e.firebasestorage.app",messagingSenderId:"231800286831",appId:"1:231800286831:web:557ddf56a2654ca169279a"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let me=null,meData=null,isSignup=false,unsubNotes=null;

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

function msg(el,text,ok=false){$(el).innerHTML=`<p class="${ok?"ok":"err"}">${esc(text)}</p>`}
function money(v){return Number(v||0).toLocaleString("ar-EG")}

$("switchAuth").onclick=()=>{isSignup=!isSignup;$("authTitle").textContent=isSignup?"إنشاء حساب":"تسجيل الدخول";$("authSub").textContent=isSignup?"أنشئ حسابك المجاني":"ادخل إلى حسابك في Next Plus";$("nameWrap").classList.toggle("hidden",!isSignup);$("authBtn").textContent=isSignup?"إنشاء الحساب":"تسجيل الدخول";$("switchAuth").textContent=isSignup?"لدي حساب بالفعل":"إنشاء حساب جديد";$("authMsg").innerHTML=""};

$("authBtn").onclick=async()=>{
  const email=$("email").value.trim(),password=$("password").value,name=$("name").value.trim();
  if(!email||!password||(isSignup&&!name)) return msg("authMsg","املأ البيانات المطلوبة");
  try{
    if(isSignup){
      const r=await createUserWithEmailAndPassword(auth,email,password);
      try{
        await setDoc(doc(db,"users",r.user.uid),{
          name,
          email,
          balance:0,
          role:"user",
          createdAt:serverTimestamp()
        });
      }catch(profileError){
        console.error("Firestore profile error:",profileError);
        // The Firebase Auth account was already created successfully.
        // Keep the user signed in and let onAuthStateChanged create/fix
        // the profile when permissions allow it.
        msg("authMsg","تم إنشاء الحساب، لكن تعذر حفظ بيانات الحساب في قاعدة البيانات. تأكد من قواعد Firestore ثم حدّث الصفحة.");
        return;
      }
    }else{
      await signInWithEmailAndPassword(auth,email,password);
    }
  }catch(e){
    console.error("Auth error:",e);
    msg("authMsg",firebaseError(e.code));
  }
};
function firebaseError(c){
  return c==="auth/email-already-in-use"?"البريد مستخدم بالفعل":
         c==="auth/invalid-credential"?"البريد أو كلمة المرور غير صحيحة":
         c==="auth/weak-password"?"كلمة المرور ضعيفة (استخدم 6 أحرف أو أكثر)":
         c==="auth/invalid-email"?"البريد الإلكتروني غير صحيح":
         c==="auth/network-request-failed"?"تحقق من اتصال الإنترنت":
         c==="auth/too-many-requests"?"محاولات كثيرة، انتظر قليلًا ثم حاول مرة أخرى":
         c==="auth/operation-not-allowed"?"تسجيل الدخول بالبريد غير مفعّل في Firebase":
         "حدث خطأ: "+(c||"غير معروف")+" — حاول مرة أخرى";
}

$("headerActions").innerHTML="";
function header(){ $("headerActions").innerHTML=me?`<button class="btn secondary" id="logout">خروج</button>`:""; if($("logout"))$("logout").onclick=()=>signOut(auth)}

document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>showPage(b.dataset.page));
function showPage(p){document.querySelectorAll(".page").forEach(x=>x.classList.add("hidden"));$(p+"Page").classList.remove("hidden");if(p==="services")renderServices();if(p==="orders")renderOrders();if(p==="notifications")renderNotes();if(p==="home")renderHome();if(p==="account")renderAccount();}

onAuthStateChanged(auth,async user=>{
  me=user; header();
  if(unsubNotes){unsubNotes();unsubNotes=null}
  if(!user){
    $("authView").classList.remove("hidden");
    $("appView").classList.add("hidden");
    return;
  }
  $("authView").classList.add("hidden");
  $("appView").classList.remove("hidden");
  const snap=await getDoc(doc(db,"users",user.uid));
  meData=snap.exists()?snap.data():{name:user.email,balance:0,role:"user"};
  if(!snap.exists())await setDoc(doc(db,"users",user.uid),meData);
  $("adminNav").classList.toggle("hidden",meData.role!=="admin");
  listenNotes(); renderAll();
});
function renderAll(){renderHome();renderServices();renderAccount()}
function renderHome(){ $("welcomeName").textContent=meData?.name||me?.email||"";$("balance").textContent=money(meData?.balance);renderHomeServices();renderHomeNotes()}
function renderAccount(){$("accountName").textContent=meData?.name||"";$("accountEmail").textContent=me?.email||"";$("accountBalance").textContent=money(meData?.balance)}
async function getServices(){const s=await getDocs(collection(db,"services"));return s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.active!==false)}
async function renderServices(target="servicesList"){const box=$(target);if(!box)return;box.innerHTML="جاري التحميل...";try{const arr=await getServices();box.innerHTML=arr.length?arr.map(serviceCard).join(""):`<div class="empty">لا توجد خدمات</div>`}catch(e){box.innerHTML="<div class='err'>تعذر تحميل الخدمات</div>"}}
function serviceCard(s){return `<div class="service"><h3>${esc(s.name)}</h3><p>${esc(s.description||"")}</p><div class="price">${money(s.price)} جنيه</div><button class="btn" onclick="orderService('${esc(s.id)}')">طلب الخدمة</button></div>`}
async function renderHomeServices(){await renderServices("homeServices")}
async function orderService(id){
  try{
    const s=await getDoc(doc(db,"services",id));if(!s.exists())return alert("الخدمة غير موجودة");
    const d=s.data(),price=Number(d.price||0),bal=Number(meData.balance||0);
    if(bal<price)return alert("رصيدك غير كافي");
    const details=prompt(`اكتب بيانات تنفيذ ${d.name} (مثال: رقم الهاتف):`);if(!details)return;
    await addDoc(collection(db,"orders"),{userId:me.uid,userName:meData.name||"",serviceId:id,serviceName:d.name,price,details,status:"pending",createdAt:serverTimestamp()});
    await updateDoc(doc(db,"users",me.uid),{balance:bal-price});
    meData.balance=bal-price;renderAll();alert("تم إرسال الطلب وخصم الرصيد ✅");
  }catch(e){console.error(e);alert("حدث خطأ أثناء الطلب")}
}
window.orderService=orderService;
async function renderOrders(){const box=$("ordersList");box.innerHTML="جاري التحميل...";try{const q=query(collection(db,"orders"),where("userId","==",me.uid));const s=await getDocs(q);const a=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));box.innerHTML=a.length?a.map(o=>`<div class="order"><b>${esc(o.serviceName)}</b><p>السعر: ${money(o.price)} جنيه</p><p>البيانات: ${esc(o.details)}</p><span class="badge">${statusText(o.status)}</span></div>`).join(""):`<div class="empty">لا توجد طلبات</div>`}catch(e){box.innerHTML="<div class='err'>تعذر تحميل الطلبات</div>"}}
function statusText(s){return ({pending:"قيد التنفيذ",processing:"جاري التنفيذ",done:"تم التنفيذ",cancelled:"ملغي"}[s]||s||"غير معروف")}
function listenNotes(){const q=query(collection(db,"notifications"),where("userId","==",me.uid));unsubNotes=onSnapshot(q,s=>{window.notes=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));renderNotes();renderHomeNotes()})}
function noteHTML(n){return `<div class="note"><b>${esc(n.title||"إشعار")}</b><p>${esc(n.message)}</p><small class="muted">${n.createdAt?.toDate?n.createdAt.toDate().toLocaleString("ar-EG"):""}</small></div>`}
function renderNotes(){const a=window.notes||[];$("notesList").innerHTML=a.length?a.map(noteHTML).join(""):`<div class="empty">لا توجد إشعارات</div>`}
function renderHomeNotes(){const a=(window.notes||[]).slice(0,3);$("homeNotes").innerHTML=a.length?a.map(noteHTML).join(""):`<div class="empty">لا توجد إشعارات</div>`}
function renderAdmin(type){
  const box=$("adminContent");box.innerHTML="جاري التحميل...";
  if(type==="users")adminUsers();if(type==="services")adminServices();if(type==="orders")adminOrders();if(type==="notify")adminNotify();
}
document.querySelectorAll("[data-admin]").forEach(b=>b.onclick=()=>renderAdmin(b.dataset.admin));
async function adminUsers(){const s=await getDocs(collection(db,"users"));$("adminContent").innerHTML=`<div class="card"><h2>👥 المستخدمين</h2>${s.docs.map(d=>{const u=d.data();return `<div class="user"><b>${esc(u.name||"بدون اسم")}</b><p>${esc(u.email||"")}</p><p>الرصيد: <span class="ok">${money(u.balance)} جنيه</span></p><div class="actions"><button class="btn" onclick="changeBalance('${d.id}',1)">إضافة رصيد</button><button class="btn secondary" onclick="changeBalance('${d.id}',-1)">خصم رصيد</button><button class="btn warn" onclick="sendUserNote('${d.id}')">إرسال إشعار</button></div></div>`}).join("")}</div>`}
async function changeBalance(uid,mode){const amount=Number(prompt(mode===1?"مبلغ الإضافة":"مبلغ الخصم"));if(!amount||amount<0)return;const s=await getDoc(doc(db,"users",uid));if(!s.exists())return;const old=Number(s.data().balance||0),next=mode===1?old+amount:Math.max(0,old-amount);await updateDoc(doc(db,"users",uid),{balance:next});await addDoc(collection(db,"notifications"),{userId:uid,title:mode===1?"تم إضافة رصيد":"تم خصم رصيد",message:`تم تحديث رصيدك بمبلغ ${money(amount)} جنيه. رصيدك الحالي ${money(next)} جنيه.`,createdAt:serverTimestamp()});alert("تمت العملية")}
window.changeBalance=changeBalance;
async function sendUserNote(uid){const title=prompt("عنوان الإشعار");if(!title)return;const message=prompt("نص الإشعار");if(!message)return;await addDoc(collection(db,"notifications"),{userId:uid,title,message,createdAt:serverTimestamp()});alert("تم إرسال الإشعار")}
window.sendUserNote=sendUserNote;
async function adminNotify(){$("adminContent").innerHTML=`<div class="card"><h2>🔔 إرسال إشعار جماعي</h2><input id="ntitle" placeholder="عنوان الإشعار"><textarea id="nmsg" placeholder="نص الإشعار"></textarea><button class="btn" onclick="broadcast()">إرسال لكل المستخدمين</button><p class="muted">سيظهر الإشعار داخل حساب كل مستخدم.</p></div>`}
async function broadcast(){const title=$("ntitle").value.trim(),message=$("nmsg").value.trim();if(!title||!message)return alert("اكتب العنوان والرسالة");const s=await getDocs(collection(db,"users"));for(const d of s.docs){if(d.data().role!=="admin")await addDoc(collection(db,"notifications"),{userId:d.id,title,message,createdAt:serverTimestamp()})}alert("تم الإرسال")}
window.broadcast=broadcast;
async function adminServices(){const s=await getDocs(collection(db,"services"));$("adminContent").innerHTML=`<div class="card"><div class="toprow"><h2>🛍️ الخدمات</h2><button class="btn" onclick="newService()">إضافة خدمة</button></div>${s.docs.map(d=>{const x=d.data();return `<div class="service"><b>${esc(x.name)}</b><p>${money(x.price)} جنيه • ${x.active===false?"متوقفة":"نشطة"}</p><div class="actions"><button class="btn" onclick="editService('${d.id}')">تعديل</button><button class="btn secondary" onclick="toggleService('${d.id}',${x.active!==false})">${x.active===false?"تفعيل":"إيقاف"}</button><button class="btn danger" onclick="removeService('${d.id}')">حذف</button></div></div>`}).join("")}</div>`}
window.newService=async()=>{const name=prompt("اسم الخدمة");if(!name)return;const price=Number(prompt("السعر"));if(isNaN(price))return;const description=prompt("الوصف")||"";await addDoc(collection(db,"services"),{name,price,description,active:true,createdAt:serverTimestamp()});adminServices()}
window.editService=async id=>{const s=await getDoc(doc(db,"services",id));if(!s.exists())return;const x=s.data(),name=prompt("اسم الخدمة",x.name);if(!name)return;const price=Number(prompt("السعر",x.price));if(isNaN(price))return;const description=prompt("الوصف",x.description||"")||"";await updateDoc(doc(db,"services",id),{name,price,description});adminServices()}
window.toggleService=async(id,current)=>{await updateDoc(doc(db,"services",id),{active:!current});adminServices()}
window.removeService=async id=>{if(confirm("حذف الخدمة؟")){await deleteDoc(doc(db,"services",id));adminServices()}}
async function adminOrders(){const s=await getDocs(collection(db,"orders"));const a=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));$("adminContent").innerHTML=`<div class="card"><h2>📦 الطلبات</h2>${a.length?a.map(o=>`<div class="order"><b>${esc(o.serviceName)}</b><p>العميل: ${esc(o.userName||"")}</p><p>البيانات: ${esc(o.details)}</p><p>السعر: ${money(o.price)} جنيه</p><span class="badge">${statusText(o.status)}</span><div class="actions"><button class="btn" onclick="setOrder('${o.id}','processing','جاري تنفيذ طلبك')">بدء التنفيذ</button><button class="btn" onclick="setOrder('${o.id}','done','تم تنفيذ طلبك، الخدمة جاهزة')">تم التنفيذ</button><button class="btn danger" onclick="setOrder('${o.id}','cancelled','تم إلغاء الطلب')">إلغاء</button></div></div>`).join(""):`<div class="empty">لا توجد طلبات</div>`}</div>`}
async function setOrder(id,status,message){const s=await getDoc(doc(db,"orders",id));if(!s.exists())return;const o=s.data();await updateDoc(doc(db,"orders",id),{status});await addDoc(collection(db,"notifications"),{userId:o.userId,title:"تحديث الطلب",message,createdAt:serverTimestamp()});alert("تم تحديث الطلب وإرسال الإشعار");adminOrders()}
window.setOrder=setOrder;
$("adminNav").onclick=()=>showPage("admin");
</script>
</body>
</html>
