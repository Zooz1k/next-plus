<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Next Plus</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Tahoma,sans-serif;
}

body{
  background:#080b12;
  color:#fff;
  min-height:100vh;
}

header{
  padding:18px 6%;
  border-bottom:1px solid #202633;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:#20d6a3;
  font-size:25px;
  font-weight:bold;
}

.container{
  width:92%;
  max-width:600px;
  margin:35px auto;
}

.card{
  background:#111722;
  border:1px solid #242c3a;
  border-radius:20px;
  padding:25px;
  margin-bottom:20px;
}

h1{
  font-size:30px;
  margin-bottom:10px;
}

h2{
  margin-bottom:20px;
}

p{
  color:#9da7b8;
  line-height:1.8;
}

input{
  width:100%;
  padding:15px;
  margin:8px 0;
  border-radius:12px;
  border:1px solid #303949;
  background:#080b12;
  color:white;
  font-size:16px;
}

button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:0;
  border-radius:12px;
  background:#20d6a3;
  color:#06100c;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button.secondary{
  background:#18202d;
  color:white;
  border:1px solid #303949;
}

button.logout{
  width:auto;
  padding:10px 18px;
  background:#18202d;
  color:white;
}

.hidden{
  display:none!important;
}

.error{
  color:#ff6b6b;
  margin-top:10px;
}

.success{
  color:#20d6a3;
  margin-top:10px;
}

.balance{
  font-size:32px;
  color:#20d6a3;
  font-weight:bold;
  margin-top:10px;
}

.notification{
  padding:15px;
  border-radius:12px;
  background:#18202d;
  margin-top:10px;
}

.service{
  padding:18px;
  border:1px solid #283142;
  border-radius:15px;
  margin-top:12px;
}

.service-title{
  font-size:19px;
  font-weight:bold;
}

.price{
  color:#20d6a3;
  font-size:20px;
  font-weight:bold;
  margin-top:8px;
}
</style>
</head>

<body>

<header>
  <div class="logo">Next Plus</div>
  <button id="logoutBtn" class="logout hidden">تسجيل خروج</button>
</header>

<div class="container">

  <!-- تسجيل الدخول -->
  <div id="loginPage" class="card">
    <h1>تسجيل الدخول</h1>
    <p>ادخل بيانات حسابك للدخول إلى Next Plus</p>

    <input id="loginEmail" type="email" placeholder="البريد الإلكتروني">
    <input id="loginPassword" type="password" placeholder="كلمة المرور">

    <button onclick="login()">دخول</button>

    <button class="secondary" onclick="showSignup()">
      إنشاء حساب جديد
    </button>

    <div id="loginError" class="error"></div>
  </div>


  <!-- إنشاء حساب -->
  <div id="signupPage" class="card hidden">
    <h1>إنشاء حساب</h1>
    <p>أنشئ حسابك على Next Plus</p>

    <input id="signupName" type="text" placeholder="الاسم">
    <input id="signupEmail" type="email" placeholder="البريد الإلكتروني">
    <input id="signupPassword" type="password" placeholder="كلمة المرور">

    <button onclick="signup()">إنشاء الحساب</button>

    <button class="secondary" onclick="showLogin()">
      عندي حساب بالفعل
    </button>

    <div id="signupError" class="error"></div>
  </div>


  <!-- حساب العميل -->
  <div id="dashboard" class="hidden">

    <div class="card">
      <h1>أهلاً <span id="userName"></span> 👋</h1>
      <p>دي لوحة حسابك في Next Plus</p>

      <br>

      <p>رصيدك الحالي</p>
      <div class="balance">
        <span id="balance">0</span> جنيه
      </div>
    </div>


    <div class="card">
      <h2>🔔 الإشعارات</h2>

      <div id="notifications">
        <p>لا توجد إشعارات حالياً</p>
      </div>
    </div>


    <div class="card">
      <h2>🛍️ الخدمات</h2>

      <div id="services">
        <p>جاري تحميل الخدمات...</p>
      </div>
    </div>

  </div>


  <!-- لوحة الأدمن -->
  <div id="adminDashboard" class="hidden">

    <div class="card">
      <h1>لوحة الإدارة 👑</h1>
      <p>أنت مسجل كمسؤول في Next Plus.</p>
    </div>

    <div class="card">
      <h2>إدارة الموقع</h2>

      <button onclick="alert('هنضيف إدارة المستخدمين هنا')">
        👥 المستخدمين
      </button>

      <button onclick="alert('هنضيف إدارة الخدمات هنا')">
        🛍️ الخدمات
      </button>

      <button onclick="alert('هنضيف إدارة الطلبات هنا')">
        📦 الطلبات
      </button>

      <button onclick="alert('هنضيف إرسال الإشعارات هنا')">
        🔔 إرسال إشعار
      </button>

      <button onclick="alert('هنضيف شحن الرصيد هنا')">
        💰 إضافة رصيد
      </button>

    </div>

  </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  getDoc,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* Firebase */

const firebaseConfig = {
  apiKey: "AIzaSyAxNbiOlJbslTTw9kAA-TPksib1TuwxL0",
  authDomain: "next-plus-ae61e.firebaseapp.com",
  projectId: "next-plus-ae61e",
  storageBucket: "next-plus-ae61e.firebasestorage.app",
  messagingSenderId: "231800286831",
  appId: "1:231800286831:web:557ddf56a2654ca169279a"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);


/* الصفحات */

window.showSignup = function(){
  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("signupPage").classList.remove("hidden");
};

window.showLogin = function(){
  document.getElementById("signupPage").classList.add("hidden");
  document.getElementById("loginPage").classList.remove("hidden");
};


/* إنشاء حساب */

window.signup = async function(){

  const name =
    document.getElementById("signupName").value.trim();

  const email =
    document.getElementById("signupEmail").value.trim();

  const password =
    document.getElementById("signupPassword").value;

  const error =
    document.getElementById("signupError");

  error.textContent = "";

  if(!name || !email || !password){
    error.textContent = "من فضلك املأ جميع البيانات";
    return;
  }

  if(password.length < 6){
    error.textContent = "كلمة المرور لازم تكون 6 أحرف على الأقل";
    return;
  }

  try{

    const result =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

    const user = result.user;

    await setDoc(
      doc(db,"users",user.uid),
      {
        name:name,
        email:email,
        balance:0,
        role:"user",
        notifications:[],
        createdAt:new Date()
      }
    );

    alert("تم إنشاء الحساب بنجاح ✅");

  }catch(e){

    console.error(e);

    error.textContent =
      "حدث خطأ أثناء إنشاء الحساب";
  }
};


/* تسجيل الدخول */

window.login = async function(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const error =
    document.getElementById("loginError");

  error.textContent = "";

  if(!email || !password){
    error.textContent =
      "اكتب البريد الإلكتروني وكلمة المرور";
    return;
  }

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(e){

    console.error(e);

    error.textContent =
      "البريد الإلكتروني أو كلمة المرور غير صحيحة";
  }
};


/* مراقبة تسجيل الدخول */

onAuthStateChanged(auth, async(user)=>{

  const loginPage =
    document.getElementById("loginPage");

  const signupPage =
    document.getElementById("signupPage");

  const dashboard =
    document.getElementById("dashboard");

  const adminDashboard =
    document.getElementById("adminDashboard");

  const logoutBtn =
    document.getElementById("logoutBtn");


  if(!user){

    loginPage.classList.remove("hidden");
    signupPage.classList.add("hidden");
    dashboard.classList.add("hidden");
    adminDashboard.classList.add("hidden");
    logoutBtn.classList.add("hidden");

    return;
  }


  loginPage.classList.add("hidden");
  signupPage.classList.add("hidden");
  logoutBtn.classList.remove("hidden");


  const userDoc =
    await getDoc(
      doc(db,"users",user.uid)
    );


  if(!userDoc.exists()){

    dashboard.classList.remove("hidden");
    document.getElementById("userName").textContent =
      user.email;

    return;
  }


  const data = userDoc.data();


  document.getElementById("userName").textContent =
    data.name || user.email;

  document.getElementById("balance").textContent =
    data.balance || 0;


  /* الإشعارات */

  const notifications =
    document.getElementById("notifications");

  notifications.innerHTML = "";

  if(data.notifications && data.notifications.length){

    data.notifications
      .slice()
      .reverse()
      .forEach(notification=>{

        const div =
          document.createElement("div");

        div.className = "notification";

        div.textContent = notification;

        notifications.appendChild(div);

      });

  }else{

    notifications.innerHTML =
      "<p>لا توجد إشعارات حالياً</p>";
  }


  /* الخدمات */

  await loadServices();


  if(data.role === "admin"){

    dashboard.classList.add("hidden");
    adminDashboard.classList.remove("hidden");

  }else{

    dashboard.classList.remove("hidden");
    adminDashboard.classList.add("hidden");

  }

});


/* تحميل الخدمات */

async function loadServices(){

  const servicesBox =
    document.getElementById("services");

  servicesBox.innerHTML = "";

  try{

    const snapshot =
      await getDocs(
        collection(db,"services")
      );

    if(snapshot.empty){

      servicesBox.innerHTML =
        "<p>لا توجد خدمات حالياً</p>";

      return;
    }


    snapshot.forEach(item=>{

      const data = item.data();

      const service =
        document.createElement("div");

      service.className = "service";

      service.innerHTML = `
        <div class="service-title">
          ${data.name || "خدمة"}
        </div>

        <div class="price">
          ${data.price || 0} جنيه
        </div>

        <button>
          طلب الخدمة
        </button>
      `;

      servicesBox.appendChild(service);

    });

  }catch(e){

    console.error(e);

    servicesBox.innerHTML =
      "<p>تعذر تحميل الخدمات</p>";
  }
}


/* تسجيل الخروج */

document
  .getElementById("logoutBtn")
  .addEventListener("click",async()=>{

    await signOut(auth);

  });

</script>

</body>
</html>
